<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Julian's Visavontuur</title>

    <!-- PWA + iOS Safari "Add to Home Screen" support -->
    <meta name="theme-color" content="#1c2530" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Visavontuur" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa/icon-512.png" />
    <style>
      /* HTML carries the fallback colour (visible only where nothing else
         draws). Body MUST stay transparent: the backdrop <video> sits at
         z-index -1 inside body, and an opaque body background would paint
         over it. */
      html {
        background: #0d1b2a;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      body {
        background: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        /* Clip absolutely-positioned children (cloud DIVs) so they can't
           spill into letterbox bars on browsers with non-16:9 aspects. */
        overflow: hidden;
      }
      /* Hide tap-highlight on mobile so taps feel snappy. */
      * {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
