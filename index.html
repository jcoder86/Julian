<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Julian's Visavontuur</title>

    <!-- PWA + iOS Safari "Add to Home Screen" support -->
    <meta name="theme-color" content="#1c2530" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Visavontuur" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa/icon-512.png" />
    <style>
      /* HTML carries the fallback colour (visible only where nothing else
         draws). Body MUST stay transparent: the backdrop <video> sits at
         z-index -1 inside body, and an opaque body background would paint
         over it. */
      html {
        background: #0d1b2a;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
        /* The game owns every touch: no pull-to-refresh, no rubber-band
           scrolling, no pinch-zoom while fishing on a phone. */
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        background: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        /* The canvas is scaled to COVER this box (Phaser Scale.ENVELOP),
           so it is usually larger than the screen on one axis. Clip it --
           and the cloud DIVs that live in here -- to the visible area. */
        overflow: hidden;
        /* Explicit stacking context for the canvas + cloud DOM layers, so
           the TitleScene's fullscreen <img> background can sit below it
           with a NON-negative z-index. iPad Safari has known bugs that
           hide fixed-positioned elements with z-index < 0 behind the
           html background; positive z-index avoids that. */
        position: relative;
        z-index: 1;
      }
      /* Hide tap-highlight on mobile so taps feel snappy. */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* "Turn your device" hint. The game is a landscape scene; on a phone
         or tablet held upright there is no sensible crop of it, so cover
         the screen with a wordless rotate cue instead. Touch devices only
         (pointer: coarse) -- a tall desktop browser window just gets the
         cropped scene. */
      #rotate-hint {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        background: #0d1b2a;
        align-items: center;
        justify-content: center;
      }
      #rotate-hint .device {
        width: 84px;
        height: 140px;
        box-sizing: border-box;
        border: 6px solid #ffffff;
        border-radius: 16px;
        position: relative;
        animation: rotate-hint 2.4s ease-in-out infinite;
      }
      #rotate-hint .device::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 22px;
        height: 4px;
        margin-left: -11px;
        border-radius: 2px;
        background: #ffffff;
      }
      @keyframes rotate-hint {
        0%, 20%   { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint" aria-hidden="true"><div class="device"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
