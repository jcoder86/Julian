server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip is helpful for the ~1.5 MB JS bundle and JSON files. Skip
  # binary formats that are already compressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Use nginx's default mime-types as the BASE, then add the few we need
  # to override. NEVER write a `types { }` block alone -- that wipes the
  # default mapping (text/html, application/javascript, etc.) and every
  # response gets served as application/octet-stream, which browsers
  # respond to by downloading instead of rendering.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/manifest+json webmanifest;
  }

  # Hashed JS / CSS chunks get aggressive caching -- the filename
  # changes on every content change, so the cache never serves stale.
  location ~* /assets/.+\.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker itself MUST NOT be cached: browsers fetch /sw.js
  # on each visit to detect new versions of the precache manifest.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: everything that doesn't exist on disk falls back to
  # index.html. Not strictly required for our single-route game but
  # keeps the door open for future client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
